    <script>
    // Konfigurasi file
    const EXCEL_FILE_URL = 'index-data.xlsx';
    const TARGET_SHEET_NAME = "penjualan-salmo";

async function updateDataFromExcel() {

    try {

        // AMBIL FILE TERBARU
        const response = await fetch(
            EXCEL_FILE_URL + "?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("File Excel gagal dibaca");
        }

        // AMBIL ARRAY BUFFER
        const arrayBuffer =
            await response.arrayBuffer();
await cekUpdateExcel(
    'penjualan-salmo',
    arrayBuffer
);
        // BACA EXCEL
        const workbook =
            XLSX.read(
                arrayBuffer,
                { type: 'array' }
            );

        // =========================
        // TANGGAL UPDATE FILE
        // =========================

        let updateDate = null;

        // PRIORITAS 1:
        // DARI PROPERTIES EXCEL
        if (
            workbook.Props &&
            workbook.Props.ModifiedDate
        ) {

            updateDate =
                new Date(
                    workbook.Props.ModifiedDate
                );
        }

        // PRIORITAS 2:
        // DARI SERVER
        if (
            !updateDate ||
            isNaN(updateDate)
        ) {

            const lastModified =
                response.headers.get(
                    "Last-Modified"
                );

            if (lastModified) {

                updateDate =
                    new Date(lastModified);
            }
        }

        // TAMPILKAN TANGGAL
        if (
            updateDate &&
            !isNaN(updateDate)
        ) {

            document.getElementById(
                "updateTime"
            ).textContent =
                "Update Data: " +
                updateDate.toLocaleString(
                    "id-ID",
                    {
                        day: "2-digit",
                        month: "long",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );
        }

        // =========================
        // AMBIL SHEET
        // =========================

        const worksheet =
            workbook.Sheets[
                TARGET_SHEET_NAME
            ];

        if (!worksheet) {
            throw new Error(
                "Sheet tidak ditemukan"
            );
        }

        // CONVERT JSON
        const data =
            XLSX.utils.sheet_to_json(
                worksheet
            );

        // FILTER GRAND TOTAL
        const dataCSO =
            data.filter(
                row =>
                    row['Nama cso']
                    !== "Grand Total"
            );

        // SORT DESC
        dataCSO.sort(
            (a, b) =>
                b.Amount - a.Amount
        );

        const tbody =
            document.querySelector(
                'tbody'
            );

        tbody.innerHTML = '';

        let totalCalculation = 0;

        const chartLabels = [];
        const chartData = [];

        // LOOP DATA
        dataCSO.forEach(
            (row, index) => {

                const tr =
                    document.createElement(
                        'tr'
                    );

                const rankClass =
                    index < 3
                    ? `r${index + 1}`
                    : '';

                const rankDisplay =
                    index < 3
                    ? `
                    <span class="
                        rank-badge
                        ${rankClass}
                    ">
                        ${index + 1}
                    </span>
                    `
                    : `
                    <span class="
                        rank-badge
                    ">
                        ${index + 1}
                    </span>
                    `;

                const amount =
                    parseInt(
                        row.Amount
                    ) || 0;

                tr.innerHTML = `
                    <td>
                        ${rankDisplay}
                        ${row['Nama cso']}
                    </td>

                    <td class="text-right">
                        ${amount.toLocaleString('id-ID')}
                    </td>
                `;

                tbody.appendChild(tr);

                totalCalculation += amount;

                chartLabels.push(
                    row['Nama cso']
                );

                chartData.push(amount);
            }
        );

        // GRAND TOTAL
        const footer =
            document.createElement('tr');

        footer.className =
            'grand-total';

        footer.innerHTML = `
            <td>Grand Total</td>

            <td class="text-right">
                ${totalCalculation.toLocaleString('id-ID')}
            </td>
        `;

        tbody.appendChild(footer);

        // CHART
        createChart(
            chartLabels,
            chartData
        );

    } catch (error) {

        console.error(
            "Gagal memuat data Excel:",
            error
        );

        document.getElementById(
            "updateTime"
        ).textContent =
            "Update Data: Gagal memuat";
    }
}
let salmoChart;

function createChart(labels, data) {

    const ctx = document.getElementById('salmoChart').getContext('2d');

    // Hapus chart lama jika ada
    if (salmoChart) {
        salmoChart.destroy();
    }

    salmoChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Penjualan SALMO MEI 2026',
                data: data,
                borderWidth: 3,
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: {
                    display: true
                }
            },

            scales: {
                y: {
                    ticks: {
                        callback: function(value) {
                            return 'Rp ' + value.toLocaleString('id-ID');
                        }
                    }
                }
            }
        }
    });
}

    // Jalankan fungsi
    updateDataFromExcel();

 
</script>
