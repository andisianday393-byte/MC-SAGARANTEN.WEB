<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Gudang Otomatis - Monitor Excel Real-time</title>
    <link rel="stylesheet" href="global-ui.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        
        /* TABEL DENGAN ALIGNMENT TETAP */
        .dashboard-container { width: 100%; max-width: 900px; margin: 20px auto; padding: 0 10px; }
        table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; }
        th, td { padding: 12px 10px; font-size: 12px; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #475569; font-weight: 700; text-transform: uppercase; border-bottom: 2px solid #cbd5e1; }
        
        th:nth-child(2), th:nth-child(3), th:nth-child(4) { text-align: right; }
        td:nth-child(2), td:nth-child(3), td:nth-child(4) { text-align: right; font-variant-numeric: tabular-nums; }
        
        .item-name-col { text-align: left; font-weight: 600; color: #334155; }
        .total-row td { background-color: #fef08a !important; color: #713f12 !important; font-weight: 700; }
        .loading-text { text-align: center; padding: 30px; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>
<div class="sticky-container">
    <div class="header-wrapper">
      <div class="back-container" onclick="goBack()">
    <div class="back-button"></div>
    </div>
        <div class="app-header">
            <h1>STOK BARANG GUDANG</h1>
        <p>Data Monitor Stok Segel dan Sellin</p>
        </div>
    </div>
</div>
    <div class="dashboard-container">
      <div id="updateTime" style="font-size: 11px; color: #64748b; margin-bottom: 5px; font-weight: 500;">
        Update Data: Memuat...
    </div>
        <table>
            <thead>
                <tr><th class="item-name-col">Nama Barang</th><th>Segel</th><th>Sell-In</th><th>Total</th></tr>
            </thead>
            <tbody id="stok-data-table">
                <tr><td colspan="4" class="loading-text">🔄 Mengambil data terbaru...</td></tr>
            </tbody>
        </table>
    </div>
<footer class="bottom-nav">

    <!-- HOME -->
    <a href="index.html" class="bottom-item active">
        <div>🏠</div>
        <span>Home</span>
    </a>

   <!-- REPORT -->
    <a href="#" class="bottom-item">
        <div>📊</div>
        <span>Report</span>
    </a>

    <!-- NOTIF -->
    <a href="#" class="bottom-item">
        <div>🔔</div>
        <span>Notif</span>
    </a>

    <!-- PROFILE -->
    <a href="#" class="bottom-item">
        <div>👤</div>
        <span>Profil</span>
    </a>

</footer>
    <script>

const excelFileUrl = "index-data.xlsx";
const TARGET_SHEET_NAME = "stok-gudang";

async function fetchExcelData() {

    try {

        // AMBIL FILE TERBARU
        const response = await fetch(
            excelFileUrl + "?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("File gagal dibaca");
        }

        // AMBIL DATA FILE
        const arrayBuffer =
            await response.arrayBuffer();

        // BACA EXCEL
        const workbook =
            XLSX.read(
                arrayBuffer,
                { type: "array" }
            );

        // AMBIL SHEET
        const sheet =
            workbook.Sheets[
                TARGET_SHEET_NAME
            ];

        if (!sheet) {
            throw new Error(
                "Sheet tidak ditemukan"
            );
        }

        // UBAH KE JSON
        const matrix =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    header: 1,
                    defval: ""
                }
            );

        // TAMPILKAN TABEL
        renderTable(matrix);

        // =========================
        // TANGGAL UPDATE FILE EXCEL
        // =========================

        let updateDate = null;

        // AMBIL DARI PROPERTIES EXCEL
        if (
            workbook.Props &&
            workbook.Props.ModifiedDate
        ) {

            updateDate =
                new Date(
                    workbook.Props.ModifiedDate
                );
        }

        // FALLBACK LAST MODIFIED SERVER
        if (
            !updateDate ||
            isNaN(updateDate)
        ) {

            const lastModified =
                response.headers.get(
                    "Last-Modified"
                );

            if (lastModified) {
                updateDate =
                    new Date(lastModified);
            }
        }

        // TAMPILKAN TANGGAL
        if (
            updateDate &&
            !isNaN(updateDate)
        ) {

            document.getElementById(
                "updateTime"
            ).textContent =
                "Update Data: " +
                updateDate.toLocaleString(
                    "id-ID",
                    {
                        day: "2-digit",
                        month: "long",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );
        }
        else {

            document.getElementById(
                "updateTime"
            ).textContent =
                "Update Data: Tidak diketahui";
        }

    } catch (error) {

        console.error(error);

        document.getElementById(
            "stock-data-table"
        ).innerHTML =
            `
            <tr>
                <td colspan="6"
                    class="loading-text">
                    ⚠️ Gagal memuat data Excel
                </td>
            </tr>
            `;

        document.getElementById(
            "updateTime"
        ).textContent =
            "Update Data: Gagal memuat";
    }
}

function renderTable(matrix) {

    const tbody =
        document.getElementById(
            'stok-data-table'
        );

    let html = "";
    let tSegel = 0;
    let tSellIn = 0;

    matrix.forEach((row, i) => {

        if (i < 2 || !row[0]) return;

        let segel =
            parseInt(row[1]) || 0;

        let sellIn =
            parseInt(row[2]) || 0;

        let total =
            segel + sellIn;

        tSegel += segel;
        tSellIn += sellIn;

        html += `
            <tr>

                <td class="item-name-col">
                    ${row[0]}
                </td>

                <td>
                    ${segel.toLocaleString()}
                </td>

                <td>
                    ${sellIn.toLocaleString()}
                </td>

                <td>
                    ${total.toLocaleString()}
                </td>

            </tr>
        `;
    });

    html += `
        <tr class="total-row">

            <td class="item-name-col">
                TOTAL
            </td>

            <td>
                ${tSegel.toLocaleString()}
            </td>

            <td>
                ${tSellIn.toLocaleString()}
            </td>

            <td>
                ${(tSegel + tSellIn).toLocaleString()}
            </td>

        </tr>
    `;

    tbody.innerHTML = html;
}

// LOAD HALAMAN
document.addEventListener(
    'DOMContentLoaded',
    fetchExcelData
);

</script>
    <script src="global-ui.js"></script>
</body>
</html>
