<body>

  <div class="sticky-container">
      <div class="header-wrapper">

          <div class="app-header">

</div>
      </div>
  </div>
         
    <div class="dashboard-container">
      <div id="updateTime" style="font-size: 11px; color: #64748b; margin-top: 15px; font-weight: 500;">
        Update Data: Memuat...
    </div>
        <table>
            <thead>
                <tr>
                    <th class="item-name-col">Jenis Barang</th>

                    <th class="data-user-col">Farhan</th>
                    <th class="data-user-col">Enden</th>
                    <th class="data-user-col">Pebrian</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="cso-stock-table">
                <tr>
                    <td colspan="6" class="loading-text">🔄 Sedang mengambil data terbaru langsung dari Excel...</td>

    <script>
const excelFileUrl = "penjualan-reguler-new.xlsx - Lembar1.csv"; // Nama file yang baru

async function fetchExcelData() {
    try {
        const fileUrl = excelFileUrl + "?v=" + Date.now();
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error("Gagal akses file");

        const text = await response.text();
        // Menggunakan opsi type: "string" untuk CSV
        const workbook = XLSX.read(text, { type: "string" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        // Ambil data dalam bentuk array matrix (baris demi baris)
        const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

        if (matrix.length === 0) throw new Error("File kosong");

        // Tampilkan Waktu Update
        document.getElementById("updateTime").textContent = "Update Data: " + new Date().toLocaleTimeString("id-ID");

        processAndRender(matrix);
    } catch (error) {
        console.error("Error Detail:", error);
        document.getElementById("cso-stock-table").innerHTML = `<tr><td colspan="6" class="loading-text">⚠️ Gagal: ${error.message}</td></tr>`;
    }
}

function parseNum(val) {
    if (val === undefined || val === null || val === "" || val === "-") return 0;
    if (typeof val === 'number') return val;
    let clean = val.toString().replace(/[^0-9]/g, ''); // Hapus semua karakter selain angka
    return parseInt(clean) || 0;
}

function formatDisplay(num) {
    return num === 0 ? `<span class="zero-val">-</span>` : num.toLocaleString('id-ID');
}

function processAndRender(matrix) {
    let html = "";
    let dataSp = [];
    let dataVdk = [];
    let isVoucherGroup = false;
    let totals = { andi: 0, farhan: 0, enden: 0, pebrian: 0, grand: 0 };

    // Debugging: Cetak baris pertama ke console untuk memastikan struktur benar
    console.log("Struktur baris pertama:", matrix[1]);

    matrix.forEach((row, index) => {
        // Lewati header (baris 0 & 1 berdasarkan snippet Anda)
        if (index < 2 || !row[0]) return;
        
        let nama = row[0].toString().trim();
        
        // Deteksi pindah ke grup VOUCHER (kata kunci di kolom pertama)
        if (nama.toLowerCase().includes("voucher")) {
            isVoucherGroup = true;
            return;
        }

        // Lewati baris total dari CSV
        if (nama.toLowerCase().includes("total")) return;

        // Ambil angka dari kolom index 1, 2, 3, 4
        let andi = parseNum(row[1]);
        let farhan = parseNum(row[2]);
        let enden = parseNum(row[3]);
        let pebrian = parseNum(row[4]);
        
        let totalBaris = andi + farhan + enden + pebrian;

        totals.andi += andi;
        totals.farhan += farhan;
        totals.enden += enden;
        totals.pebrian += pebrian;
        totals.grand += totalBaris;

        let item = { nama, andi, farhan, enden, pebrian, total: totalBaris };
        if (isVoucherGroup) dataVdk.push(item);
        else dataSp.push(item);
    });

    // ... (sisa kode makeRow dan rendering html sama dengan sebelumnya)
    const makeRow = (item) => `<tr><td class="item-name-col">${item.nama}</td><td class="data-user-col">${formatDisplay(item.andi)}</td><td class="data-user-col">${formatDisplay(item.farhan)}</td><td class="data-user-col">${formatDisplay(item.enden)}</td><td class="data-user-col">${formatDisplay(item.pebrian)}</td><td>${formatDisplay(item.total)}</td></tr>`;

    dataSp.forEach(i => html += makeRow(i));
    if (dataSp.length > 0) html += `<tr class="empty-row"><td colspan="6"></td></tr>`;
    dataVdk.forEach(i => html += makeRow(i));

    html += `<tr class="total-row"><td class="item-name-col">TOTAL</td><td class="data-user-col">${totals.andi.toLocaleString('id-ID')}</td><td class="data-user-col">${totals.farhan.toLocaleString('id-ID')}</td><td class="data-user-col">${totals.enden.toLocaleString('id-ID')}</td><td class="data-user-col">${totals.pebrian.toLocaleString('id-ID')}</td><td>${totals.grand.toLocaleString('id-ID')}</td></tr>`;

    document.getElementById('cso-stock-table').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', () => {
    fetchExcelData();
    setInterval(fetchExcelData, 30000);
});

</script>
<script src="global-ui.js"></script>
