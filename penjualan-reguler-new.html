 #tableDaily,

.section-row td{

.total-row td{

.empty-row td{

.loading-text{

.zero-val{

}

tbody tr:hover td{

}

.round-bottom-sp td:first-child{

}

.round-bottom-sp td:last-child{

}

.round-top-voucher td:first-child{

}

.round-top-voucher td:last-child{

}

.cell-left{

.weekly-product{

    text-align:left !important;
}

.weekly-num{

.weekly-total-cell{

@media(min-width:768px){

    }

    }
}

@media(max-width:767px){

        width:34%;
    }
}

@media(orientation:landscape){
    th{
        font-size:10px !important;
        padding:5px !important;

}

                <th style="border-right:1px solid #e2e8f0;">W1</th><th style="border-right:1px solid #e2e8f0;">W2</th><th style="border-right:1px solid #e2e8f0;">W3</th><th style="border-right:1px solid #e2e8f0;">W4</th><th style="border-right:1px solid #e2e8f0;">Total</th>

<script>

const excelFileUrl = "index-data.xlsx";
const TARGET_SHEET_NAME = "penjualan-reguler-new";

// ==========================
// FETCH EXCEL
// ==========================

async function fetchExcelData(){

    try{

        const response =
            await fetch(
                excelFileUrl + "?v=" + Date.now()
            );

        if(!response.ok){
            throw new Error("Gagal mengambil file Excel");
        }

        const lastModified =
            response.headers.get("Last-Modified");

        const arrayBuffer =
            await response.arrayBuffer();

        const workbook =
            XLSX.read(arrayBuffer,{
                type:"array"
            });

        const sheet =
            workbook.Sheets[TARGET_SHEET_NAME];

        if(!sheet){
            throw new Error("Sheet tidak ditemukan");
        }

        const matrix =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    header:1,
                    defval:""
                }
            );

        processAndRender(matrix);

        // ==========================
// TAMPILKAN WAKTU UPDATE
// ==========================

let updateDate = null;

// PRIORITAS 1
// TANGGAL DARI FILE EXCEL
if (
    workbook.Props &&
    workbook.Props.ModifiedDate
) {

    updateDate =
        new Date(
            workbook.Props.ModifiedDate
        );
}

// PRIORITAS 2
// LAST MODIFIED SERVER
if (
    (!updateDate || isNaN(updateDate)) &&
    lastModified
) {

    updateDate =
        new Date(lastModified);
}

// TAMPILKAN
if (
    updateDate &&
    !isNaN(updateDate)
) {

    document.getElementById(
        "updateTime"
    ).textContent =
        "Update Data: " +
        updateDate.toLocaleString(
            "id-ID",
            {
                day: "2-digit",
                month: "long",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

} 

else {

    document.getElementById(
        "updateTime"
    ).textContent =
        "Update Data: Tidak diketahui";
}

    }
    
    catch(error){

        console.error(error);

        // Di dalam catch(error)
document.getElementById("bodyDaily").innerHTML = `<tr><td colspan="6" class="loading-text">⚠️ Gagal memuat data</td></tr>`;
document.getElementById("bodyTotal").innerHTML = `<tr><td colspan="8" class="loading-text">⚠️ Gagal memuat data</td></tr>`;


    }

}

// ==========================
// FORMAT ANGKA
// ==========================

function formatNumber(val){

    if(
        val === null ||
        val === undefined ||
        val === ""
    ){
        return `<span class="zero-val">-</span>`;
    }

    if(typeof val === "number"){
        return val.toLocaleString("id-ID");
    }

    return val;

}

function processAndRender(matrix) {
    if (!matrix || matrix.length === 0) return;

    const headerRow = matrix[0];

    document.getElementById("headDaily").innerHTML = `
        <tr>
            <th>Produk</th>
            <th>${headerRow[1] || 'Andi'}</th>
            <th>${headerRow[3] || 'Parhan'}</th>
            <th>${headerRow[5] || 'Enden'}</th>
            <th>${headerRow[7] || 'Pebrian'}</th>
            <th>Total PCS</th>
            <th>Harga</th>
            <th>Total Rp</th>
        </tr>
    `;

    let htmlDaily = "";
    let htmlTotal = "";
    let htmlWeekly = "";

    let runningPCS = 0;
    let runningRp = 0;
    let keptWeeklyTotalRow = false;

    matrix.slice(1).forEach((row) => {
        if (!row || row.length === 0) return;

        const cell15 = String(row[15] || "").trim().toLowerCase();
        if (cell15 === "nama barang" || cell15 === "weekly" || (row[0] === "" && row[15] === "")) return;

        const row0 = String(row[0] || "").trim().toUpperCase();
        const isSection = row0 === "SP" || row0 === "VOUCHER";
        const isTotalSP = row0 === "TOTAL SP";
        const isTotalVoucher = row0 === "TOTAL VOUCHER";
        const isAnyTotal = isTotalSP || isTotalVoucher;

        if (isSection) {
            runningPCS = 0;
            runningRp = 0;

            htmlDaily += `<tr class="section-row"><td colspan="8">${row0}</td></tr>`;
            htmlTotal += `<tr class="section-row"><td colspan="8">${row0}</td></tr>`;
            htmlWeekly += `<tr class="section-row"><td colspan="22">${row0}</td></tr>`;
            return;
        }

        if (isTotalVoucher) {
            if (keptWeeklyTotalRow) return;
            keptWeeklyTotalRow = true;
        }

        const v1 = parseFloat(row[1]) || 0;
        const v2 = parseFloat(row[3]) || 0;
        const v3 = parseFloat(row[5]) || 0;
        const v4 = parseFloat(row[7]) || 0;
        const harga = parseFloat(row[11]) || 0;
        const linePCS = v1 + v2 + v3 + v4;
        const lineRp = linePCS * harga;

        if (!isAnyTotal) {
            runningPCS += linePCS;
            runningRp += lineRp;
        }

        const dailyPCS = isAnyTotal ? (parseFloat(row[10]) || runningPCS) : linePCS;
        const dailyRp = isAnyTotal ? (parseFloat(row[13]) || runningRp) : lineRp;

        const rowClass = isAnyTotal ? "total-row" : "";

        htmlDaily += `
            <tr class="${rowClass}">
                <td>${row[0]}</td>
                <td>${formatNumber(row[1])}</td>
                <td>${formatNumber(row[3])}</td>
                <td>${formatNumber(row[5])}</td>
                <td>${formatNumber(row[7])}</td>
                <td>${formatNumber(dailyPCS)}</td>
                <td>${isAnyTotal ? "-" : formatNumber(harga)}</td>
                <td>${formatNumber(dailyRp)}</td>
            </tr>
        `;

        htmlTotal += `
            <tr class="${rowClass}">
                <td>${row[0]}</td>
                <td>${formatNumber(row[2])}</td>
                <td>${formatNumber(row[4])}</td>
                <td>${formatNumber(row[6])}</td>
                <td>${formatNumber(row[8])}</td>
                <td>${formatNumber(row[10])}</td>
                <td>${formatNumber(row[11])}</td>
                <td>${formatNumber(row[13])}</td>
            </tr>
        `;

        htmlWeekly += `
            <tr class="${rowClass}">
                <td class="weekly-product">${row[15] || '-'}</td>
                <td class="weekly-num">${formatNumber(row[16])}</td>
                <td class="weekly-num">${formatNumber(row[17])}</td>
                <td class="weekly-num">${formatNumber(row[18])}</td>
                <td class="weekly-num">${formatNumber(row[19])}</td>
                <td class="weekly-total-cell weekly-num">${formatNumber(row[20])}</td>
                <td class="weekly-num">${formatNumber(row[21])}</td>
                <td class="weekly-num">${formatNumber(row[22])}</td>
                <td class="weekly-num">${formatNumber(row[23])}</td>
                <td class="weekly-num">${formatNumber(row[24])}</td>
                <td class="weekly-total-cell weekly-num">${formatNumber(row[25])}</td>
                <td class="weekly-num">${formatNumber(row[26])}</td>
                <td class="weekly-num">${formatNumber(row[27])}</td>
                <td class="weekly-num">${formatNumber(row[28])}</td>
                <td class="weekly-num">${formatNumber(row[29])}</td>
                <td class="weekly-total-cell weekly-num">${formatNumber(row[30])}</td>
                <td class="weekly-num">${formatNumber(row[31])}</td>
                <td class="weekly-num">${formatNumber(row[32])}</td>
                <td class="weekly-num">${formatNumber(row[33])}</td>
                <td class="weekly-num">${formatNumber(row[34])}</td>
                <td class="weekly-total-cell weekly-num">${formatNumber(row[35])}</td>
                <td class="weekly-grand-total weekly-num">${formatNumber(row[36])}</td>
            </tr>
        `;
    });

    document.getElementById("bodyDaily").innerHTML = htmlDaily;
    document.getElementById("bodyTotal").innerHTML = htmlTotal;
    document.getElementById("bodyWeekly").innerHTML = htmlWeekly;
}
  
  function showTab(type) {
    const daily = document.getElementById('wrapperDaily');
    const weekly = document.getElementById('wrapperWeekly');
    const total = document.getElementById('wrapperTotal');

    const btnDaily = document.getElementById('btnDaily');
    const btnWeekly = document.getElementById('btnWeekly');
    const btnTotal = document.getElementById('btnTotal');

    if (!daily || !weekly || !total || !btnDaily || !btnWeekly || !btnTotal) {
        console.error('Element tab atau wrapper tidak ditemukan');
        return;
    }

    daily.style.display = (type === 'daily') ? 'block' : 'none';
    weekly.style.display = (type === 'weekly') ? 'block' : 'none';
    total.style.display = (type === 'total') ? 'block' : 'none';

    btnDaily.className = (type === 'daily') ? 'tab-btn active' : 'tab-btn';
    btnWeekly.className = (type === 'weekly') ? 'tab-btn active' : 'tab-btn';
    btnTotal.className = (type === 'total') ? 'tab-btn active' : 'tab-btn';
}



// ==========================
// LOAD
// ==========================

document.addEventListener(
    "DOMContentLoaded",
    ()=>{

        fetchExcelData();

        // AUTO REFRESH
        setInterval(()=>{
            fetchExcelData();
        },30000);

    }
);

</script>
