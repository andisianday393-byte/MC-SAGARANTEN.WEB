<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi - MC-SAGARANTEN</title>
    <link rel="stylesheet" href="global-ui.css">
    <style>
        .content-wrapper { padding: 0 10px; }
        .notif-card { background: #fff; border-radius: 8px; margin-top: 15px; border: 1px solid var(--border-color); overflow: hidden; }
        .notif-item {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: #f8fafc; }
        
        .notif-icon {
            font-size: 20px;
            margin-right: 15px;
            margin-top: 2px;
        }
        
        .notif-content .title { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 2px; }
        .notif-content .desc { font-size: 11px; color: #64748b; line-height: 1.4; }
        .notif-content .time { font-size: 9px; color: #94a3b8; margin-top: 5px; font-weight: 600; text-transform: uppercase; }
        
        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 12px; }
        .notif-checkbox {
    display: none;
}

.notif-item.select-mode .notif-checkbox {
    display: block;
}

.notif-item.select-mode {
    background: #f8fafc;
}
/* NOTIF BARU */
.notif-item.unread {
    background: #eff6ff;
    border-left: 3px solid #2563eb;
}

/* NOTIF SUDAH DIBACA */
.notif-item.read {
    background: #ffffff;
    opacity: 0.85;
}        
        .hapus-btn {
    /* Hapus position: absolute; top: ...; right: ...; */
    border: none;
    background: #fee2e2;
    color: #dc2626;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    display: flex;       /* Tambahkan ini agar tanda X di tengah */
    align-items: center;
    justify-content: center;
}

    </style>
</head>
<body>

<div class="header-wrapper">
    <div class="back-container" onclick="goBack()">
        <div class="back-button"></div>
    </div>
    <div class="app-header">
        <h1>Notifikasi</h1>
        <p>Pembaruan sistem dan data terbaru</p>
    </div>
</div>

<div class="content-wrapper">
    <div id="aksi-bar" style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
        <div style="display: flex; flex-direction: column;">
            <label style="font-size: 11px; color: #64748b;">
                <input type="checkbox" id="pilih-semua"> Pilih Semua
            </label>
            <!-- ✅ TAMBAHKAN INI: Teks samar di bawah checkbox -->
            <span style="font-size: 9px; color: #94a3b8; margin-top: 3px; display: block;">
                Tekan lama hapus pesan terpilih
            </span>
        </div>
        <button id="btn-hapus-terpilih" style="background:#fee2e2; border:none; color:#dc2626; padding:5px 10px; border-radius:5px; font-size:10px; font-weight:bold; cursor:pointer;">
            Hapus Terpilih
        </button>
    </div>

    <div class="notif-card" id="notif-list">
    </div>
</div>


<script src="notif.js"></script>
<script src="global-ui.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const list = document.getElementById('notif-list');
    const aksiBar = document.getElementById('aksi-bar');
    const pilihSemua = document.getElementById('pilih-semua');
    const btnHapus = document.getElementById('btn-hapus-terpilih');

    let modePilih = false; // mode pilih / hapus

    // Sembunyikan aksi bar kalau tidak ada notif
    function updateUIState() {
        const logs = JSON.parse(localStorage.getItem('notif_logs') || '[]');
        if (logs.length === 0) {
            aksiBar.style.display = 'none';
            pilihSemua.checked = false;
            list.innerHTML = '<div class="empty-state">Tidak ada notifikasi</div>';
        } else {
            aksiBar.style.display = 'flex';
        }
    }

    // Switch ke mode pilih (tampilkan checkbox semua)
    function masukModePilih() {
        if (modePilih) return;
        modePilih = true;

        document.querySelectorAll('.notif-item').forEach(item => {
            item.classList.add('select-mode');
            const checkbox = item.querySelector('.notif-checkbox');
            // pastikan checkbox terlihat (bisa juga pakai CSS)
            checkbox.style.display = 'block';
        });
    }

    // Keluar dari mode pilih (sembunyikan checkbox)
    function keluarModePilih() {
        modePilih = false;

        document.querySelectorAll('.notif-item').forEach(item => {
            item.classList.remove('select-mode');
            const checkbox = item.querySelector('.notif-checkbox');
            checkbox.checked = false;
            checkbox.style.display = 'none';
        });
    }

    // Klik normal (bukan checkbox) → baca notif
    function aktifkanKlikNotif() {
        document.querySelectorAll('.notif-item').forEach(item => {
            item.removeEventListener('click', onClick);
            item.addEventListener('click', onClick);
        });
    }

    // Klik normal = baca
    function onClick(e) {
        // Kalau di mode pilih, jangan ubah read saat klik checkbox
        if (e.target.classList.contains('notif-checkbox')) return;

        // Jika tidak dalam mode pilih, klik = baca
        if (!modePilih) {
            const item = e.currentTarget;
            const index = parseInt(item.dataset.index);

            const logs = JSON.parse(localStorage.getItem('notif_logs') || '[]');
            if (logs[index] && !logs[index].read) {
                logs[index].read = true;
                localStorage.setItem('notif_logs', JSON.stringify(logs));
                window.dispatchEvent(new Event('storage')); // update badge
                renderNotif(); // refresh tampilan
            }
        } else {
            // Dalam mode pilih, klik = toggle checkbox saja
            const checkbox = e.currentTarget.querySelector('.notif-checkbox');
            const item = e.currentTarget;

            checkbox.checked = !checkbox.checked;
            if (checkbox.checked) {
                item.classList.add('select-mode');
            } else {
                item.classList.remove('select-mode');
            }
        }
    }

    // Long press di salah satu notif → masuk mode pilih
    function aktifkanLongPress() {
        const items = document.querySelectorAll('.notif-item');
        items.forEach(item => {
            let pressTimer;

            item.addEventListener('touchstart', () => {
                pressTimer = setTimeout(() => {
                    masukModePilih(); // tekan lama di satu notif → semua checkbox muncul
                }, 500);
            });

            item.addEventListener('touchend', () => {
                clearTimeout(pressTimer);
            });

            item.addEventListener('touchmove', () => {
                clearTimeout(pressTimer);
            });
        });
    }

    // Render tampilan
    function renderNotif() {
        const logs = JSON.parse(localStorage.getItem('notif_logs') || '[]');

        if (logs.length === 0) {
            list.innerHTML = '<div class="empty-state">Tidak ada notifikasi</div>';
            updateUIState();
            return;
        }

        list.innerHTML = logs.map((log, index) => {
            const isUnread = !log.read;
            return `
                <div class="notif-item ${isUnread ? 'unread' : 'read'}" data-index="${index}">
                    <div class="notif-content">
                        <div class="title">Pembaruan Sistem</div>
                        <div class="desc">${log.pesan}</div>
                        <div class="time">${log.waktu}</div>
                    </div>
                    <input type="checkbox" class="notif-checkbox" value="${index}" style="display: none;">
                </div>
            `;
        }).join('');

        updateUIState();
        aktifkanKlikNotif();
        aktifkanLongPress();
        if (!modePilih) keluarModePilih(); // pastikan mode pilih direset jika ada masalah
    }

    // Pilih Semua
pilihSemua.addEventListener('change', function () {
    const checkboxes = document.querySelectorAll('.notif-checkbox');

    if (this.checked) {
        masukModePilih();

        checkboxes.forEach(cb => {
            cb.checked = true;
            const item = cb.closest('.notif-item');
            item.classList.add('select-mode');
        });
    } else {
        checkboxes.forEach(cb => {
            cb.checked = false;
            const item = cb.closest('.notif-item');
            item.classList.remove('select-mode');
        });

        keluarModePilih();
    }
});

    // Hapus Terpilih
    btnHapus.addEventListener('click', () => {
        const logs = JSON.parse(localStorage.getItem('notif_logs') || '[]');
        const checkboxes = document.querySelectorAll('.notif-checkbox:checked');

        if (checkboxes.length === 0) {
            alert('Pilih dulu notifikasi yang mau dihapus');
            return;
        }

        const indexToDel = Array.from(checkboxes)
            .map(cb => parseInt(cb.value))
            .sort((a, b) => b - a);

        indexToDel.forEach(index => logs.splice(index, 1));

        localStorage.setItem('notif_logs', JSON.stringify(logs));
        window.dispatchEvent(new Event('storage')); // update badge
        keluarModePilih(); // checkbox dan select-mode hilang kembali
        renderNotif(); // refresh tampilan
    });

    renderNotif();
});
    
</script>
</body>
</html>
