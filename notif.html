<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi - MC-SAGARANTEN</title>
    <link rel="stylesheet" href="global-ui.css">
    <style>
        .content-wrapper { padding: 0 10px; }
        .notif-card { background: #fff; border-radius: 8px; margin-top: 15px; border: 1px solid var(--border-color); overflow: hidden; }
        .notif-item {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: #f8fafc; }
        
        .notif-icon {
            font-size: 20px;
            margin-right: 15px;
            margin-top: 2px;
        }
        
        .notif-content .title { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 2px; }
        .notif-content .desc { font-size: 11px; color: #64748b; line-height: 1.4; }
        .notif-content .time { font-size: 9px; color: #94a3b8; margin-top: 5px; font-weight: 600; text-transform: uppercase; }
        
        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 12px; }
        .notif-checkbox {
    display: none;
}

.notif-item.select-mode .notif-checkbox {
    display: block;
}

.notif-item.select-mode {
    background: #f8fafc;
}
/* NOTIF BARU */
.notif-item.unread {
    background: #eff6ff;
    border-left: 3px solid #2563eb;
}

/* NOTIF SUDAH DIBACA */
.notif-item.read {
    background: #ffffff;
    opacity: 0.85;
}        
        .hapus-btn {
    /* Hapus position: absolute; top: ...; right: ...; */
    border: none;
    background: #fee2e2;
    color: #dc2626;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    display: flex;       /* Tambahkan ini agar tanda X di tengah */
    align-items: center;
    justify-content: center;
}

    </style>
</head>
<body>

<div class="header-wrapper">
    <div class="back-container" onclick="goBack()">
        <div class="back-button"></div>
    </div>
    <div class="app-header">
        <h1>Notifikasi</h1>
        <p>Pembaruan sistem dan data terbaru</p>
    </div>
</div>

<div class="content-wrapper">
    <div id="aksi-bar"      style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
        <label style="font-size: 11px; color: #64748b;">
            <input type="checkbox" id="pilih-semua"> Pilih Semua
        </label>
        <button id="btn-hapus-terpilih" style="background:#fee2e2; border:none; color:#dc2626; padding:5px 10px; border-radius:5px; font-size:10px; font-weight:bold; cursor:pointer;">
            Hapus Terpilih
        </button>
    </div>

    <div class="notif-card" id="notif-list">
        </div>
</div>



<script src="global-ui.js"></script>
<script src="notif.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const list = document.getElementById('notif-list');

    // Fungsi untuk ambil data TERBARU dari localStorage
    function getLogs() {
        return JSON.parse(localStorage.getItem('notif_logs') || '[]');
    }

    // =========================
    // RENDER NOTIF
    // =========================

    function renderNotif() {
        const logs = getLogs(); // Selalu ambil data terbaru
        const aksiBar = document.getElementById('aksi-bar');

        const unreadCount =
            logs.filter(log => !log.read).length;

        localStorage.setItem(
            'notif_badge',
            unreadCount
        );
        updateBadge();

    if (logs.length === 0) {

            aksiBar.style.display = 'none';

            list.innerHTML =
                '<div class="empty-state">Tidak ada notifikasi</div>';

            return;
        }

        aksiBar.style.display = 'flex';

        list.innerHTML = logs.map((log, index) => `

            <div class="notif-item ${!log.read ? 'unread' : 'read'}"
                 data-index="${index}">

                <input type="checkbox"
                       class="notif-checkbox"
                       value="${index}"
                       style="margin-right:15px; margin-top:5px;">

                <div class="notif-icon">
                    ${!log.read ? '🔴' : '🔔'}
                </div>

                <div class="notif-content" style="flex:1;">
                    <div class="title">Pembaruan Sistem</div>
                    <div class="desc">${log.pesan}</div>
                    <div class="time">${log.waktu}</div>
                </div>

            </div>

        `).join('');

        aktifkanLongPress();
        aktifkanKlikNotif();
        updateBadge();
    }

    // =========================
    // KLIK NOTIF
    // =========================

// Ubah fungsi klik notif agar mengambil data terbaru sebelum dimodifikasi
    function aktifkanKlikNotif() {
        document.querySelectorAll('.notif-item').forEach(item => {
            item.addEventListener('click', (e) => {
                if (e.target.classList.contains('notif-checkbox')) return;

                let logs = getLogs(); // Ambil data terbaru
                const index = parseInt(item.dataset.index);
                logs[index].read = true;
                
                localStorage.setItem('notif_logs', JSON.stringify(logs));
                renderNotif(); // Render ulang
            });
        });
    }


    // =========================
    // LONG PRESS
    // =========================

    function aktifkanLongPress() {

        const items =
            document.querySelectorAll('.notif-item');

        items.forEach(item => {

            let pressTimer;

            item.addEventListener('touchstart', () => {

                pressTimer = setTimeout(() => {

                    item.classList.add('select-mode');

                    const checkbox =
                        item.querySelector('.notif-checkbox');

                    checkbox.checked = true;

                }, 500);

            });

            item.addEventListener('touchend', () => {
                clearTimeout(pressTimer);
            });

            item.addEventListener('touchmove', () => {
                clearTimeout(pressTimer);
            });

        });

    }

    // =========================
    // PILIH SEMUA
    // =========================

    document.getElementById('pilih-semua')
    .addEventListener('change', function() {

        const checkboxes =
            document.querySelectorAll('.notif-checkbox');

        checkboxes.forEach(cb => {

            cb.checked = this.checked;

            const item =
                cb.closest('.notif-item');

            if (this.checked) {
                item.classList.add('select-mode');
            } else {
                item.classList.remove('select-mode');
            }

        });

    });

    // =========================
    // HAPUS TERPILIH
    // =========================

// Di dalam file notif.html
// Perbaikan Hapus Terpilih
    document.getElementById('btn-hapus-terpilih').addEventListener('click', () => {
        let logs = getLogs(); // Ambil data terbaru
        const checkboxes = document.querySelectorAll('.notif-checkbox:checked');
        
        if (checkboxes.length === 0) return alert('Pilih notifikasi');

        const indexToDel = Array.from(checkboxes).map(cb => parseInt(cb.value));
        indexToDel.sort((a, b) => b - a).forEach(index => logs.splice(index, 1));

        localStorage.setItem('notif_logs', JSON.stringify(logs));
        renderNotif();
    });

    renderNotif();
});
</script>
</body>
</html>
