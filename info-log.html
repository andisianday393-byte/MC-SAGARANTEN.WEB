<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Log - MC-SAGARANTEN</title>
    <link rel="stylesheet" href="global-ui.css">
    <style>
    html, body {
    width: 100%;
    overflow-x: hidden;
}

}body {
    padding-top: 70px;
    overflow-x: hidden;
}

.content-wrapper {
    padding: 0 12px 90px;
    max-width: 1100px;
    margin: 0 auto;
}

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .stat-card, .card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .stat-card {
            padding: 14px;
        }

        .stat-label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: .4px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin-top: 6px;
        }

        .card {
            padding: 14px;
            margin-top: 14px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 800;
            color: #1e3a8a;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

/* Ubah bagian table ini di CSS Anda */
.table-wrap {
    width: 100%;
    overflow-x: hidden; /* Mencegah scroll horizontal berlebih */
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed; /* Ini kunci agar kolom pas dengan lebar layar */
}

th, td {
    padding: 12px 8px;
    overflow: hidden;
    text-overflow: ellipsis; /* Menambahkan titik-titik jika teks terlalu panjang */
    white-space: nowrap;
}

/* Mengatur lebar kolom agar proporsional */
th:nth-child(1) { width: 30%; } /* Waktu */
th:nth-child(2) { width: 40%; } /* User/Aktivitas */
th:nth-child(3) { width: 30%; } /* Aksi/Halaman */


        tbody tr:hover {
            background: #f8fafc;
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (min-width: 768px) {
            .grid-stats {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
  <div class="sticky-container">
    <div class="header-wrapper">
      <div class="back-container" onclick="goBack()">
    <div class="back-button"></div>
    </div>
        <div class="app-header">
        <div class="back-container" onclick="goBack()">
            <div class="back-button"></div>
        </div>
        <div class="app-header">
            <h1>Info Log Aktivitas</h1>
            <p>Monitoring akses dan pengunduhan data</p>
        </div>
    </div>
          </div>
    </div>
    <div class="content-wrapper">
        <div class="grid-stats">
            <div class="stat-card">
                <div class="stat-label">Total Pengunjung</div>
                <div id="totalVisitor" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Download</div>
                <div id="totalDownload" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Log Hari Ini</div>
                <div id="todayLogCount" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Update Terakhir</div>
                <div id="lastUpdate" class="stat-value" style="font-size:14px;">-</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📜 Riwayat Terakhir</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>User</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="logBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="global-ui.js"></script>
    <script>
        function getTodayKey() {
            const d = new Date();
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function countVisitorOncePerDay() {
            const today = getTodayKey();
            const lastVisit = localStorage.getItem('last_visit_date');

            if (lastVisit !== today) {
                localStorage.setItem('last_visit_date', today);
                fetch('https://script.google.com/macros/s/AKfycbyUT3r7IVH8NJMjOJxS6nykthmdSEdwnUmSUq7ExAE2yHfw4HH48UZQNSBKGNNZUnOZ/exec?type=visitor');
            }
        }

        async function loadLog() {
            try {
                countVisitorOncePerDay();

                const response = await fetch('https://script.google.com/macros/s/AKfycbyUT3r7IVH8NJMjOJxS6nykthmdSEdwnUmSUq7ExAE2yHfw4HH48UZQNSBKGNNZUnOZ/exec');
                const data = await response.json();

                document.getElementById('totalVisitor').innerText = data.stats.totalVisitor ?? 0;
                document.getElementById('totalDownload').innerText = data.stats.totalDownload ?? 0;

                const logs = Array.isArray(data.logs) ? data.logs : [];
                document.getElementById('todayLogCount').innerText = logs.length;

                const lastUpdate = logs[0]?.Waktu || '-';
                document.getElementById('lastUpdate').innerText = lastUpdate;

                const body = document.getElementById('logBody');

                if (logs.length === 0) {
                    body.innerHTML = `<tr><td colspan="3" class="empty-state">Belum ada log aktivitas</td></tr>`;
                    return;
                }

                body.innerHTML = logs.slice(0, 20).map(row => `
                    <tr>
                        <td>${row.Waktu || '-'}</td>
                        <td>${row.Aktivitas || '-'}</td>
                        <td>${row.Halaman || '-'}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.log("ERROR:", err);
                document.getElementById('logBody').innerHTML =
                    `<tr><td colspan="3" class="empty-state">Gagal memuat data log</td></tr>`;
            }
        }

        loadLog();
    </script>
</body>
</html>
