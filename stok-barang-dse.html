    <script>

const excelFileUrl = "index-data.xlsx";
const TARGET_SHEET_NAME = "stok-barang-dse";

// ===============================
// AMBIL DATA EXCEL
// ===============================
async function fetchExcelData() {

    try {

        // CACHE BUSTER
        const fileUrl =
            excelFileUrl + "?v=" + Date.now();

        // FETCH FILE
        const response =
            await fetch(fileUrl);

        if (!response.ok) {
            throw new Error("File Excel gagal diambil");
        }

        // LAST MODIFIED DARI SERVER
        const lastModified =
            response.headers.get("Last-Modified");

        // AMBIL DATA FILE
        const arrayBuffer =
            await response.arrayBuffer();
await cekUpdateExcel(
    'stok-akhir-dse',
    arrayBuffer
);
        // BACA EXCEL
        const workbook =
            XLSX.read(arrayBuffer, {
                type: "array"
            });

        // AMBIL SHEET
        const sheet =
            workbook.Sheets[TARGET_SHEET_NAME];

        if (!sheet) {
            throw new Error(
                "Sheet '" +
                TARGET_SHEET_NAME +
                "' tidak ditemukan"
            );
        }

        // UBAH KE MATRIX
        const matrix =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    header: 1,
                    defval: ""
                }
            );

        // RENDER TABEL
        processAndRender(matrix);
// ==========================
// TAMPILKAN WAKTU UPDATE
// ==========================

let updateDate = null;

// PRIORITAS 1
// TANGGAL DARI FILE EXCEL
if (
    workbook.Props &&
    workbook.Props.ModifiedDate
) {

    updateDate =
        new Date(
            workbook.Props.ModifiedDate
        );
}

// PRIORITAS 2
// LAST MODIFIED SERVER
if (
    (!updateDate || isNaN(updateDate)) &&
    lastModified
) {

    updateDate =
        new Date(lastModified);
}

// TAMPILKAN
if (
    updateDate &&
    !isNaN(updateDate)
) {

    document.getElementById(
        "updateTime"
    ).textContent =
        "Update Data: " +
        updateDate.toLocaleString(
            "id-ID",
            {
                day: "2-digit",
                month: "long",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

} else {

    document.getElementById(
        "updateTime"
    ).textContent =
        "Update Data: Tidak diketahui";
}

    } catch (error) {

        console.error(error);

        document.getElementById(
            "cso-stock-table"
        ).innerHTML = `
            <tr>
                <td colspan="6"
                    class="loading-text">
                    ⚠️ Gagal memuat data Excel
                </td>
            </tr>
        `;

        document.getElementById(
            "updateTime"
        ).textContent =
            "Update Data: Gagal memuat";
    }
}

// ===============================
// FORMAT ANGKA
// ===============================

function parseNum(val) {

    if (
        val === undefined ||
        val === null ||
        val === "-" ||
        val === ""
    ) return null;

    if (typeof val === 'number') return val;

    let clean = val
        .toString()
        .trim()
        .replace(/^"|"$/g, '');

    if (clean === "0") return 0;

    if (
        clean.toLowerCase() === "total" ||
        clean === "-"
    ) return null;

    clean = clean
        .replace(/\./g, '')
        .replace(/,/g, '');

    let parsed = parseInt(clean);

    return isNaN(parsed)
        ? null
        : parsed;
}

function formatDisplay(num) {

    if (num === null) {
        return `<span class="zero-val">-</span>`;
    }

    if (num === 0) {
        return `0`;
    }

    return num.toLocaleString('id-ID');
}

// ===============================
// RENDER TABLE
// ===============================

// ===============================
// RENDER TABLE
// ===============================

function processAndRender(matrix) {

    let html = "";

    let dataSp = [];
    let dataVdk = [];

    let isVdkActiveGroup = false;

    let grandAndi = 0;
    let grandFarhan = 0;
    let grandEnden = 0;
    let grandPebrian = 0;


    // ===============================
    // BACA DATA EXCEL
    // ===============================

    matrix.forEach(row => {

        if (!row || row.length === 0) {
            return;
        }


        let col0 = row[0]
            ? row[0]
                .toString()
                .trim()
                .replace(/^"|"$/g, '')
            : "";


        let colClean =
            col0.toLowerCase();


        // SKIP HEADER / BARIS KOSONG

        if (
            colClean === "" ||
            colClean === "jenis barang" ||
            colClean === "nama barang" ||
            colClean === "total"
        ) {
            return;
        }


        // ===============================
        // DETEKSI VDK
        // ===============================

        if (
            col0.toUpperCase() === "VDK"
        ) {

            isVdkActiveGroup = true;

        }


        // ===============================
        // AMBIL DATA USER
        // ===============================

        let andi =
            parseNum(row[1]);

        let farhan =
            parseNum(row[2]);

        let enden =
            parseNum(row[3]);

        let pebrian =
            parseNum(row[4]);


        // SKIP BARIS TANPA DATA

        if (
            andi === null &&
            farhan === null &&
            enden === null &&
            pebrian === null &&
            col0.toUpperCase() !== "VDK"
        ) {

            return;

        }


        // ===============================
        // TOTAL BARIS
        // ===============================

        let totalBaris =
            (andi || 0) +
            (farhan || 0) +
            (enden || 0) +
            (pebrian || 0);


        let itemObj = {

            nama: col0,

            andi: andi,

            farhan: farhan,

            enden: enden,

            pebrian: pebrian,

            total: totalBaris

        };


        // ===============================
        // TOTAL USER
        // HANYA DATA SP
        // ===============================

        if (
            col0.toUpperCase() !== "VDK"
        ) {

            grandAndi +=
                (andi || 0);

            grandFarhan +=
                (farhan || 0);

            grandEnden +=
                (enden || 0);

            grandPebrian +=
                (pebrian || 0);

        }


        // ===============================
        // MASUKKAN GROUP
        // ===============================

        if (isVdkActiveGroup) {

            dataVdk.push(itemObj);

        } else {

            dataSp.push(itemObj);

        }

    });


    // ===============================
    // DATA KOSONG
    // ===============================

    if (
        dataSp.length === 0 &&
        dataVdk.length === 0
    ) {

        document.getElementById(
            "cso-stock-table"
        ).innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty-text"
                >

                    Format Excel Tidak Sesuai!

                    <br>

                    <span
                        style="
                            font-weight:normal;
                            font-size:11px;
                            color:#64748b;
                        "
                    >
                        Pastikan sheet Excel benar.
                    </span>

                </td>

            </tr>

        `;

        return;

    }


    // ===============================
    // BUAT ROW
    // ===============================

    const makeRowHtml = (item) => {

        return `

            <tr class="data-row">

                <td class="item-name-col">
                    ${item.nama}
                </td>


                <td class="data-user-col">
                    ${formatDisplay(item.andi)}
                </td>


                <td class="data-user-col">
                    ${formatDisplay(item.farhan)}
                </td>


                <td class="data-user-col">
                    ${formatDisplay(item.enden)}
                </td>


                <td class="data-user-col">
                    ${formatDisplay(item.pebrian)}
                </td>


                <td class="total-col">
                    ${formatDisplay(item.total)}
                </td>

            </tr>

        `;

    };


    // ===============================
    // DATA SP
    // ===============================

    dataSp.forEach(item => {

        html +=
            makeRowHtml(item);

    });


    // ===============================
    // PEMISAH SP / VDK
    // ===============================

    if (
        dataVdk.length > 0
    ) {

        html += `

            <tr class="dse-divider">

                <td colspan="6"></td>

            </tr>

        `;


        // ===============================
        // DATA VDK
        // ===============================

        dataVdk.forEach(item => {

            html +=
                makeRowHtml(item);

        });

    }


    // ===============================
    // GRAND TOTAL
    // ===============================

    const grandTotalSemua =
        grandAndi +
        grandFarhan +
        grandEnden +
        grandPebrian;


    // ===============================
    // UPDATE SUMMARY
    // ===============================

    document.getElementById(
        "summary-andi"
    ).textContent =
        grandAndi.toLocaleString(
            "id-ID"
        );


    document.getElementById(
        "summary-farhan"
    ).textContent =
        grandFarhan.toLocaleString(
            "id-ID"
        );


    document.getElementById(
        "summary-enden"
    ).textContent =
        grandEnden.toLocaleString(
            "id-ID"
        );


    document.getElementById(
        "summary-pebrian"
    ).textContent =
        grandPebrian.toLocaleString(
            "id-ID"
        );


    document.getElementById(
        "dse-grand-total"
    ).textContent =
        grandTotalSemua.toLocaleString(
            "id-ID"
        );


    // ===============================
    // TOTAL ROW
    // ===============================

    html += `

        <tr class="total-row">

            <td class="item-name-col">
                TOTAL
            </td>


            <td class="data-user-col">
                ${grandAndi.toLocaleString("id-ID")}
            </td>


            <td class="data-user-col">
                ${grandFarhan.toLocaleString("id-ID")}
            </td>


            <td class="data-user-col">
                ${grandEnden.toLocaleString("id-ID")}
            </td>


            <td class="data-user-col">
                ${grandPebrian.toLocaleString("id-ID")}
            </td>


            <td class="total-col">
                ${grandTotalSemua.toLocaleString("id-ID")}
            </td>

        </tr>

    `;


    // ===============================
