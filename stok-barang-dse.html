        /* BARIS TOTAL PALING BAWAH */

<body>

  <div class="sticky-container">
      <div class="header-wrapper">
        <div class="back-container" onclick="goBack()">
    <div class="back-button"></div>
    </div>
          <div class="app-header">
    <h1>STOK AKHIR DSE</h1>
    <p>Monitoring Stok penambahan dan pengeluaran </p>
</div>
      </div>
  </div>
         
    <div class="dashboard-container">
      <div id="updateTime" style="font-size: 11px; color: #64748b; margin-top: 15px; font-weight: 500;">
        Update Data: Memuat...
    </div>
        <table>
            <thead>
                <tr>
                    <th class="item-name-col">Jenis Barang</th>
                    <th class="data-user-col">Andi</th>
                    <th class="data-user-col">Farhan</th>
                    <th class="data-user-col">Enden</th>
                    <th class="data-user-col">Pebrian</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="cso-stock-table">
                <tr>
                    <td colspan="6" class="loading-text">🔄 Sedang mengambil data terbaru langsung dari Excel...</td>
                </tr>
            </tbody>
        </table>
    </div>
<footer class="bottom-nav">

    <!-- HOME -->
    <a href="index.html" class="bottom-item active">
        <div>🏠</div>
        <span>Home</span>

        <div>👤</div>
        <span>Profil</span>
    </a>

</footer>
    <script>

const excelFileUrl = "index-data.xlsx";
const TARGET_SHEET_NAME = "stok-barang-dse";

// ===============================
// AMBIL DATA EXCEL
// ===============================

async function fetchExcelData() {

    try {

        const response = await fetch(excelFileUrl);

        if (!response.ok) {
            throw new Error("Gagal mengunduh file Excel.");
        }

        const arrayBuffer = await response.arrayBuffer();

        const workbook = XLSX.read(
            new Uint8Array(arrayBuffer),
            { type: 'array' }
        );

        // CEK SHEET
        if (!workbook.SheetNames.includes(TARGET_SHEET_NAME)) {
            throw new Error(
                `Sheet '${TARGET_SHEET_NAME}' tidak ditemukan`
            );
        }

        const worksheet =
            workbook.Sheets[TARGET_SHEET_NAME];

        const matrix =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header: 1,
                    defval: ""
                }
            );

        processAndRender(matrix);

        // UPDATE JAM
        const now = new Date();

const updateEl =
    document.getElementById("updateTime");

if(updateEl){

    updateEl.textContent =
        'Update Data: ' +

        now.toLocaleDateString(
            'id-ID',
            {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            }
        )

        +

        ' • ' +

        now.toLocaleTimeString(
            'id-ID',
            {
                hour: '2-digit',
                minute: '2-digit'
            }
        );
}

    } catch (error) {

        console.error(error);

        document.getElementById(
            'cso-stock-table'
        ).innerHTML = `
            <tr>
                <td colspan="6"
                    style="
                        color:#ef4444;
                        text-align:center;
                        padding:20px;
                        font-weight:bold;
                    ">
                    ⚠️ Gagal memuat data Excel.
                    <br>

                    <span style="
                        font-size:11px;
                        font-weight:normal;
                        color:#64748b;
                    ">
                        Pesan Masalah:
                        ${error.message}
                    </span>
                </td>
            </tr>
        `;
    }
}

// ===============================
// FORMAT ANGKA
// ===============================

function parseNum(val) {

    if (
        val === undefined ||
        val === null ||
        val === "-" ||
        val === ""
    ) return null;

    if (typeof val === 'number') return val;

    let clean = val
        .toString()
        .trim()
        .replace(/^"|"$/g, '');

    if (clean === "0") return 0;

    if (
        clean.toLowerCase() === "total" ||
        clean === "-"
    ) return null;

    clean = clean
        .replace(/\./g, '')
        .replace(/,/g, '');

    let parsed = parseInt(clean);

    return isNaN(parsed)
        ? null
        : parsed;
}

function formatDisplay(num) {

    if (num === null) {
        return `<span class="zero-val">-</span>`;
    }

    if (num === 0) {
        return `0`;
    }

    return num.toLocaleString('id-ID');
}

// ===============================
// RENDER TABLE
// ===============================

function processAndRender(matrix) {

    let html = "";

    let dataSp = [];
    let dataVdk = [];

    let isVdkActiveGroup = false;

    let grandAndi = 0;
    let grandFarhan = 0;
    let grandEnden = 0;
    let grandPebrian = 0;

    matrix.forEach(row => {

        if (!row || row.length === 0) return;

        let col0 = row[0]
            ? row[0]
                .toString()
                .trim()
                .replace(/^"|"$/g, '')
            : "";

        let colClean =
            col0.toLowerCase();

        if (
            colClean === "" ||
            colClean === "jenis barang" ||
            colClean === "nama barang" ||
            colClean === "total"
        ) return;

        if (col0.toUpperCase() === "VDK") {
            isVdkActiveGroup = true;
        }

        let andi = parseNum(row[1]);
        let farhan = parseNum(row[2]);
        let enden = parseNum(row[3]);
        let pebrian = parseNum(row[4]);

        if (
            andi === null &&
            farhan === null &&
            enden === null &&
            pebrian === null &&
            col0.toUpperCase() !== "VDK"
        ) return;

        let totalBaris =
            (andi || 0) +
            (farhan || 0) +
            (enden || 0) +
            (pebrian || 0);

        let itemObj = {
            nama: col0,
            andi,
            farhan,
            enden,
            pebrian,
            total: totalBaris
        };

        // TOTAL BAWAH
        if (col0.toUpperCase() !== "VDK") {

            grandAndi += (andi || 0);
            grandFarhan += (farhan || 0);
            grandEnden += (enden || 0);
            grandPebrian += (pebrian || 0);
        }

        if (isVdkActiveGroup) {
            dataVdk.push(itemObj);
        } else {
            dataSp.push(itemObj);
        }

    });

    // DATA KOSONG
    if (
        dataSp.length === 0 &&
        dataVdk.length === 0
    ) {

        document.getElementById(
            'cso-stock-table'
        ).innerHTML = `
            <tr>
                <td colspan="6"
                    style="
                        text-align:center;
                        padding:30px;
                        color:#ef4444;
                        font-weight:bold;
                    ">
                    Format Excel Tidak Sesuai!
                    <br>

                    <span style="
                        font-weight:normal;
                        font-size:11px;
                        color:#64748b;
                    ">
                        Pastikan sheet Excel benar.
                    </span>
                </td>
            </tr>
        `;

        return;
    }

    // BUAT BARIS
    const makeRowHtml = (item) => {

        return `
            <tr>

                <td class="item-name-col">
                    ${item.nama}
                </td>

                <td class="data-user-col">
                    ${formatDisplay(item.andi)}
                </td>

                <td class="data-user-col">
                    ${formatDisplay(item.farhan)}
                </td>

                <td class="data-user-col">
                    ${formatDisplay(item.enden)}
                </td>

                <td class="data-user-col">
                    ${formatDisplay(item.pebrian)}
                </td>

                <td>
                    ${formatDisplay(item.total)}
                </td>

            </tr>
        `;
    };

    // DATA SP
    dataSp.forEach(item => {
        html += makeRowHtml(item);
    });

    // DATA VDK
    if (dataVdk.length > 0) {

        html += `
            <tr class="empty-row">
                <td colspan="6"></td>
            </tr>
        `;

        dataVdk.forEach(item => {
            html += makeRowHtml(item);
        });
    }

    // GRAND TOTAL
    let grandTotalSemua =
        grandAndi +
        grandFarhan +
        grandEnden +
        grandPebrian;

    html += `
        <tr class="total-row">

            <td class="item-name-col">
                TOTAL
            </td>

            <td class="data-user-col">
                ${grandAndi.toLocaleString('id-ID')}
            </td>

            <td class="data-user-col">
                ${grandFarhan.toLocaleString('id-ID')}
            </td>

            <td class="data-user-col">
                ${grandEnden.toLocaleString('id-ID')}
            </td>

            <td class="data-user-col">
                ${grandPebrian.toLocaleString('id-ID')}
            </td>

            <td>
                ${grandTotalSemua.toLocaleString('id-ID')}
            </td>

        </tr>
    `;

    document.getElementById(
        'cso-stock-table'
    ).innerHTML = html;
}

// ===============================
// LOAD HALAMAN
// ===============================

document.addEventListener(
    'DOMContentLoaded',
    () => {

        fetchExcelData();

        // AUTO REFRESH 30 DETIK
        setInterval(() => {
            fetchExcelData();
        }, 30000);

    }
);

</script>
<script src="global-ui.js"></script>
</body>
